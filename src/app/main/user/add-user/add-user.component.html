<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass">
            <h2 [class]="_sharedComponentService.TitleTextClass">إضافة مستخدم</h2>
        </div>
    </div>
    
    <!-- Form Section -->
    <div [class]="_sharedComponentService.mainPageFormClass">
        <form [formGroup]="userForm" (ngSubmit)="onAddUser()">
            <div [class]="_sharedComponentService.subMainPageFormClass">
                <!-- Form Body -->
                <div [class]="_sharedComponentService.gridFormClass">
                    
                    <!-- User Name -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>اسم المستخدم*</mat-label>
                            <input autocomplete="off" type="text" matInput formControlName="userName" 
                                placeholder="مثال: أحمد محمد"
                                [errorStateMatcher]="matcher" />
                            <mat-error *ngIf="!userForm.controls['userName'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.invalid_message"></label>
                            </mat-error>
                            <mat-error *ngIf="userForm.controls['userName'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.required_field"></label>
                            </mat-error>
                            <mat-error *ngIf="userForm.controls['userName'].hasError('pattern')">
                                <label [innerHTML]="_sharedComponentService.invalid_pattern_1"></label>
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <!-- User Email -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>البريد الإلكتروني*</mat-label>
                            <span matPrefix class="field-icon-wrapper">
                                <i class="fas fa-envelope field-icon"></i>
                            </span>
                            <input autocomplete="off" type="email" matInput formControlName="userEmail" 
                                placeholder="example@email.com"
                                [errorStateMatcher]="matcher" />
                            <mat-error *ngIf="!userForm.controls['userEmail'].hasError('required')">
                                الرجاء إدخال بريد إلكتروني صحيح
                            </mat-error>
                            <mat-error *ngIf="userForm.controls['userEmail'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.required_field"></label>
                            </mat-error>
                            <mat-error *ngIf="userForm.controls['userEmail'].hasError('email') || userForm.controls['userEmail'].hasError('pattern')">
                                صيغة البريد الإلكتروني غير صحيحة
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <!-- User Password -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>كلمة المرور*</mat-label>
                            <span matPrefix class="field-icon-wrapper">
                                <i class="fas fa-lock field-icon"></i>
                            </span>
                            <input autocomplete="off" [type]="hide ? 'password' : 'text'" matInput 
                                formControlName="userPassword" 
                                placeholder="أدخل كلمة المرور"
                                [errorStateMatcher]="matcher" />
                            <button mat-icon-button matSuffix type="button" (click)="hide = !hide" 
                                [attr.aria-label]="'إخفاء كلمة المرور'" 
                                [attr.aria-pressed]="hide">
                                <i [class]="hide ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                            </button>
                            <mat-error *ngIf="userForm.controls['userPassword'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.required_field"></label>
                            </mat-error>
                            <mat-error *ngIf="userForm.controls['userPassword'].hasError('minlength')">
                                كلمة المرور يجب أن تكون 8 أحرف على الأقل
                            </mat-error>
                            <mat-error *ngIf="userForm.controls['userPassword'].hasError('pattern')">
                                المسموح فقط الأحرف، الفاصلة، النقطة، والخط السفلي (: | / _ , & $ @ . #)
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <!-- User Mobile -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>رقم الهاتف</mat-label>
                            <span matPrefix class="field-icon-wrapper">
                                <i class="fas fa-phone field-icon"></i>
                            </span>
                            <input autocomplete="off" type="text" matInput formControlName="userMobile" 
                                placeholder="مثال: 0123456789"
                                [errorStateMatcher]="matcher" />
                            <mat-error *ngIf="userForm.controls['userMobile'].hasError('pattern')">
                                الرجاء إدخال رقم هاتف صحيح
                            </mat-error>
                        </mat-form-field>
                    </div>

                </div>

                <!-- Buttons Section -->
                <div [class]="_sharedComponentService.btnSectionClass">
                    <div class="row row-cols-auto g-0">
                        <div class="col">
                            <button type="submit" class="btn-style submit-btn" 
                                [disabled]="!userForm.valid">
                                <i class="fas fa-user-plus"></i> إضافة مستخدم
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>
