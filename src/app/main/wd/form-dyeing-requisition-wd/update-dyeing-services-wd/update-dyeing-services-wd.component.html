<section [id]="_sharedComponentService.pageId()">
    <!-- Form Section -->
    <!-- Main Page Form -->
    <div id="update-form" [class]="_sharedComponentService.mainPageFormClass">
        <form [formGroup]="dyeingServicesWdForm" (ngSubmit)="onUpdate()">
            <div [class]="_sharedComponentService.subMainPageFormClass">
                <!-- Form Body -->
                <div [class]="_sharedComponentService.gridForm2Class">
                    <div class="row">
                        <div class="col-md-6">
                            <h3 class="text-center">
                                المعالجات المضافة
                            </h3>
                            <div [class]="_sharedComponentService.tableSectionClass">
                                <table id="table-data" mat-table matSort #sortColumns="matSort"
                                    [dataSource]="addedDyeingServiceSourceSearchTabel"
                                    [class]="_sharedComponentService.tableStyleClass">

                                    <!-- Checkbox Column -->
                                    <ng-container matColumnDef="select">
                                        <th data-html2canvas-ignore="true" mat-header-cell *matHeaderCellDef>
                                            <b>اختيار</b>
                                        </th>
                                        <td data-html2canvas-ignore="true" mat-cell *matCellDef="let row" style="width: 5%;">
                                            <mat-checkbox (click)="getSelectedAddedDyeingServicesIndex(row)" (click)="$event.stopPropagation()"
                                                (change)="$event ? addedDyeingServicesSelection.toggle(row) : null"
                                                [checked]="addedDyeingServicesSelection.isSelected(row)">
                                            </mat-checkbox>
                                        </td>
                                        <td data-html2canvas-ignore="true" mat-footer-cell *matFooterCellDef></td>
                                    </ng-container>

                                    <!-- Name Column -->
                                    <ng-container matColumnDef="name">
                                        <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                            <b>اسم الخدمة</b>
                                        </th>
                                        <td mat-cell *matCellDef="let element">
                                            {{ element.name }}
                                        </td>
                                    </ng-container>

                                    <!-- price Column -->
                                    <ng-container matColumnDef="price">
                                        <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                            <b>السعر</b>
                                        </th>
                                        <td mat-cell *matCellDef="let element">
                                            {{ element.price }}
                                        </td>
                                    </ng-container>

                                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                                </table>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <h3 class="text-center">
                                المعالجات الغير مضافة
                            </h3>
                            <div [class]="_sharedComponentService.tableSectionClass">
                                <table id="table-data" mat-table matSort #sortDyeingServicesColumns="matSort"
                                    [dataSource]="dyeingServiceSourcesSearchTabel"
                                    [class]="_sharedComponentService.tableStyleClass">

                                    <!-- Checkbox Column -->
                                    <ng-container matColumnDef="select">
                                        <th data-html2canvas-ignore="true" mat-header-cell *matHeaderCellDef>
                                            <b>اختيار</b>
                                        </th>
                                        <td data-html2canvas-ignore="true" mat-cell *matCellDef="let row" style="width: 5%;">
                                            <mat-checkbox (click)="getSelectedDyeingServicesIndex(row)" (click)="$event.stopPropagation()"
                                                (change)="$event ? dyeingServicesSelection.toggle(row) : null"
                                                [checked]="dyeingServicesSelection.isSelected(row)">
                                            </mat-checkbox>
                                        </td>
                                        <td data-html2canvas-ignore="true" mat-footer-cell *matFooterCellDef></td>
                                    </ng-container>

                                    <!-- Name Column -->
                                    <ng-container matColumnDef="name">
                                        <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                            <b>اسم الخدمة</b>
                                        </th>
                                        <td mat-cell *matCellDef="let element">
                                            {{ element.name }}
                                        </td>
                                    </ng-container>

                                    <!-- price Column -->
                                    <ng-container matColumnDef="price">
                                        <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                            <b>السعر</b>
                                        </th>
                                        <td mat-cell *matCellDef="let element">
                                            {{ element.price }}
                                        </td>
                                    </ng-container>

                                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                                </table>
                            </div>
                        </div>


                    </div>

                </div>

            </div>

            <!-- Buttons Section -->
            <div [class]="_sharedComponentService.btnSectionClass">
                <div class="row row-cols-auto">
                    <div class="col">
                        <button type="submit" class="btn-style submit-btn">تعديل</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>
