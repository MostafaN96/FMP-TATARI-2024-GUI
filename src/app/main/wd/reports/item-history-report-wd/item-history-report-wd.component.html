<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass" id="main-page-title">
            <h2 [class]="_sharedComponentService.TitleTextClass">تقرير جرد المصبغة</h2>
        </div>
    </div>

    <mat-tab-group animationDuration="0ms">
        <mat-tab label="إجمالي">
            <app-item-history-total-report-wd>
            </app-item-history-total-report-wd>
        </mat-tab>
        <mat-tab label="تفصيلي">
            <!-- Form Section -->

            <div class="container-fluid mt-2">
                <div class="row row-cols-3">
                    <div class="col">
                        <div class="btn-export-section">
                            <a (click)="_exportDataService.onExportPDFGridAngular(gridApi, 'تقرير جرد المصبغة', gridColumnApi, ['details'])">
                        <i title="PDF" class="far fa-file-pdf"></i>
                    </a>

                    <a (click)="_exportDataService.onExportExcelGridAngular(gridApi, 'تقرير جرد المصبغة', ['details'])">
                        <i title="Excel" class="far fa-file-excel px-2"></i>
                    </a>
                    
                    <a
                    (click)="_exportDataService.printGrid(gridApi, 'تقرير جرد المصبغة', gridColumnApi, ['details'], ['input_quantity', 'output_quantity', 'current_quantity'])">
                    <i title="Print" class="fas fa-print pe-2"></i>
                </a>

                            <!-- <a
                                (click)="_exportDataService.exportToPDF('table-header-data', dt1?.tableViewChild?.nativeElement?.id, 'تقرير جرد المصبغة')">
                                <i title="PDF" class="far fa-file-pdf"></i>
                            </a>

                            <a
                                (click)="_exportDataService.exportToExcel('table-header-data', 'pr_id_1-table', 'تقرير جرد المصبغة')">
                                <i title="Excel" class="far fa-file-excel px-2"></i>
                            </a>

                            <a
                                (click)="_exportDataService.print('table-header-data', dt1?.tableViewChild?.nativeElement?.id, 'تقرير جرد المصبغة', 'table-data-2')">
                                <i title="Print" class="fas fa-print pe-2"></i>
                            </a> -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Page Form -->
            <div [class]="_sharedComponentService.mainPageFormClass">
                <div [class]="_sharedComponentService.subMainPageFormClass">
                    <!-- Form Body -->
                    <div [class]="_sharedComponentService.gridForm2Class">
                        <div class="col">
                            <div [class]="_sharedComponentService.tableSectionClass">

                                <div class="mb-4">
                                    <mat-checkbox class="example-margin me-3" [(ngModel)]="isShowClosedBalances"
                                        (change)="getClosedBalances()">اظهار الارصدة المغلقة</mat-checkbox>
                                </div>
                                <!-- /////////////////////////////////////////////////////////////////////////////////////////////////////////------------------------------------------------ -->

                                <div id="table-header-data-report"
                        dir="rtl"
                        class="ag-theme-alpine ag-rtl">

                            <ag-grid-angular 
                              #agGrid
                                class="ag-theme-alpine ag-rtl ag-compact"
                                [ngStyle]="_sharedComponentService.gridStyle"

                                [rowData]="fabrics"
                                [columnDefs]="columnDefs"
                                [defaultColDef]="defaultColDef"

                                [sideBar]="sideBar"
                                [localeText]="_sharedComponentService.localeText"

                                [pinnedBottomRowData]="pinnedBottomRowData"

                                [loadingCellRenderer]="loadingCellRenderer"
                                [loadingCellRendererParams]="loadingCellRendererParams"

                                (gridReady)="onGridReady($event)"
                                (modelUpdated)="onModelUpdated()">
                            </ag-grid-angular>

                        </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </mat-tab>
    </mat-tab-group>
</section>
