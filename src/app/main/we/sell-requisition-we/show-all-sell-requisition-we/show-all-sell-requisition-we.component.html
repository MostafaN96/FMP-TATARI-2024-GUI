<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass">
            <h2 [class]="_sharedComponentService.TitleTextClass">{{titlePage}}</h2>
        </div>
    </div>
    <!-- Form Section -->
    <!-- Main Page Form -->
    <div [class]="_sharedComponentService.mainPageFormClass">
        <div [class]="_sharedComponentService.subMainPageFormClass">
            <!-- Form Body -->
            <div [class]="_sharedComponentService.gridForm2Class">
                <div class="col">
                    <div [class]="_sharedComponentService.tableSectionClass">

                        <div id="table-header-data-report"
                        dir="rtl"
                        class="ag-theme-alpine ag-rtl ag-details">

                            <!-- Toolbar -->
                            <div class="grid-toolbar">
                                <button
                                    class="btn-reset-filter"
                                    [class.btn-reset-filter--active]="isFiltered"
                                    (click)="clearAg()"
                                    title="إعادة تعيين جميع الفلاتر">
                                    <i class="fa-solid fa-filter-circle-xmark"></i>
                                    <span>إعادة الفلتر</span>
                                </button>
                            </div>

                            <p-confirmPopup></p-confirmPopup>

                            <ag-grid-angular
                            #agGrid
                            class="ag-theme-alpine ag-rtl"
                            [ngStyle]="_sharedComponentService.gridStyle"
                            [gridOptions]="gridOptions"
                            [columnDefs]="columnDefs"
                            [defaultColDef]="defaultColDef"
                            [sideBar]="sideBar"
                            (gridReady)="onGridReady($event)"
                            (filterChanged)="onFilterChanged()">
                            </ag-grid-angular>

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
