<section [id]="_sharedComponentService.pageId()">
    <!-- Form Section -->
    <!-- Main Page Form -->
    <div id="update-form" [class]="_sharedComponentService.mainPageFormClass">
        <form [formGroup]="manufacturingOrderWdForm" (ngSubmit)="onUpdate()">
            <div [class]="_sharedComponentService.subMainPageFormClass">
                <!-- Form Body -->
                <div [class]="_sharedComponentService.gridFormClass">

                    <div class="col">
                        <!-- Date -->
                        <mat-form-field appearance="outline" class="example-form-field w-100">
                            <mat-label>التاريخ</mat-label>
                            <input [disabled]="true" matInput [matDatepicker]="datepicker" formControlName="date">
                            <mat-datepicker-toggle [disabled]="false" matSuffix [for]="datepicker"></mat-datepicker-toggle>
                            <mat-datepicker [disabled]="false" #datepicker>
                              
                            </mat-datepicker>
                            <mat-error *ngIf="!manufacturingOrderWdForm.controls['date'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.invalid_message">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['date'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['date'].hasError('pattern')">
                                <label [innerHTML]="_sharedComponentService.invalid_pattern_1">
                                </label>
                            </mat-error>
                          </mat-form-field>
                    </div>

                    <!-- Dyers -->
                    <div class="col">
                        <ejs-autocomplete [dataSource]='dyers' [fields]='fieldsDyeing'
                            (filtering)="onFilteringDyeing($event)" [placeholder]='textDyeing' [autofill]='autofill'
                            formControlName="sellerName" class="ejs-autocomplete w-100" (change)="selectDyeing($event)">
                        </ejs-autocomplete>
                        <small class="text-danger" *ngIf="manufacturingOrderWdForm.controls['sellerId'].hasError('pattern')"
                            [innerHTML]="_sharedComponentService.invalid_message">
                        </small>
                        <small class="text-danger" *ngIf="manufacturingOrderWdForm.controls['sellerId'].hasError('required') && (manufacturingOrderWdForm.controls['sellerId'].dirty 
                            || manufacturingOrderWdForm.controls['sellerId'].touched)"
                            [innerHTML]="_sharedComponentService.required_field">
                        </small>
                    </div>
                    
                    <!-- dyedFabrics -->
                    <div class="col">
                        <ejs-autocomplete [dataSource]='dyedFabrics' [fields]='fieldsDyedFabric' class="ejs-autocomplete w-100"
                            (filtering)="onFilteringDyedFabricName($event)" [placeholder]='textDyedFabric' [autofill]='autofill'
                            formControlName="dyedFabricName" (change)="selectDyedFabric($event)" style="width: 260px;">
                        </ejs-autocomplete>
                        <small class="text-danger" *ngIf="manufacturingOrderWdForm.controls['dyedFabricId'].hasError('pattern')"
                            [innerHTML]="_sharedComponentService.invalid_message">
                        </small>
                        <small class="text-danger" *ngIf="manufacturingOrderWdForm.controls['dyedFabricId'].hasError('required') && (manufacturingOrderWdForm.controls['dyedFabricId'].dirty 
                                || manufacturingOrderWdForm.controls['dyedFabricId'].touched)"
                            [innerHTML]="_sharedComponentService.required_field">
                        </small>
                    </div>

                    <!-- Name -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>اسم الطلبية</mat-label>
                            <input autocomplete="off" type="text" matInput formControlName="name" placeholder="مثال: طلبية-1"
                                [errorStateMatcher]="matcher" />
                            <mat-error *ngIf="!manufacturingOrderWdForm.controls['name'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.invalid_message">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['name'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['name'].hasError('pattern')">
                                <label [innerHTML]="_sharedComponentService.invalid_pattern_1">
                                </label>
                            </mat-error>
                        </mat-form-field>
                    </div>

                     <!-- note -->
                     <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label> ملاحظات الاذن </mat-label>
                            <textarea matInput rows="1" matTextareaAutosize 
                                 placeholder="ملاحظات الاذن" formControlName="note"></textarea>
                                <mat-error *ngIf="manufacturingOrderWdForm.controls['note'].hasError('pattern')">
                                    <label [innerHTML]="_sharedComponentService.invalid_message">
                                    </label>
                                </mat-error>
                        </mat-form-field>
                    </div>

                    <!-- Color Category -->
                    <div class="col">
                        <ejs-autocomplete [dataSource]='colorCategories' [fields]='fieldsColorCategory' 
                            (filtering)="onFilteringColorCategoryName($event)" [placeholder]='textColorCategory' [autofill]='autofill'
                            formControlName="colorCategoryId" class="ejs-autocomplete w-100" (change)="selectColorCategory($event)">
                        </ejs-autocomplete>
                        <small class="text-danger" *ngIf="manufacturingOrderWdForm.controls['colorCategoryId'].hasError('pattern')"
                            [innerHTML]="_sharedComponentService.invalid_message">
                        </small>
                        <small class="text-danger" *ngIf="manufacturingOrderWdForm.controls['colorCategoryId'].hasError('required') && (manufacturingOrderWdForm.controls['colorCategoryId'].dirty 
                            || manufacturingOrderWdForm.controls['colorCategoryId'].touched)"
                            [innerHTML]="_sharedComponentService.required_field">
                        </small>
                    </div>

                    <!-- Color -->
                    <div class="col">
                        <div class="row">
                            <div class="col-8">
                                <ejs-autocomplete [dataSource]='colors' [fields]='fieldsColor'  
                                (filtering)="onFilteringColorName($event)" [placeholder]='textColor' [autofill]='autofill'
                                formControlName="colorName" class="ejs-autocomplete w-100" (change)="selectColor($event)">
                            </ejs-autocomplete>
                            <small class="text-danger" *ngIf="manufacturingOrderWdForm.controls['colorId'].hasError('pattern')"
                                [innerHTML]="_sharedComponentService.invalid_message">
                            </small>
                            <small class="text-danger" *ngIf="manufacturingOrderWdForm.controls['colorId'].hasError('required') && (manufacturingOrderWdForm.controls['colorId'].dirty 
                                || manufacturingOrderWdForm.controls['colorId'].touched)"
                                [innerHTML]="_sharedComponentService.required_field">
                            </small>
                            </div>
                            <div class="col-4">
                                <mat-form-field appearance="outline" class="example-full-width w-100">
                                    <input type="text" matInput formControlName="colorCode" placeholder="كود اللون"
                                    disabled/>
                                </mat-form-field>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Quantity -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>الكمية*</mat-label>
                            <input type="text" matInput formControlName="quantity" placeholder="مثال: 12000"
                                [errorStateMatcher]="matcher"
                                oninput="this.value = this.value.replace(/[^1-90-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" 
                                />
                            <mat-error class="text-danger"
                                *ngIf="manufacturingOrderWdForm.controls['quantity'].hasError('incorrect')">
                                الكمية المدخلة غير متوفرة
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['quantity'].hasError('required') && (manufacturingOrderWdForm.controls['quantity'].dirty 
                                    || manufacturingOrderWdForm.controls['quantity'].touched)">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['quantity'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['quantity'].hasError('pattern')">
                                <label [innerHTML]="_sharedComponentService.invalid_pattern_number_only">
                                </label>
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <!-- wasteRatio -->
                    <div class="col">
                        <mat-form-field class="w-100" appearance="outline">
                            <mat-label>نسبة الهالك</mat-label>
                            <input autocomplete="off" type="text" matInput formControlName="wasteRatio"
                                placeholder="مثال: 10" [errorStateMatcher]="matcher"
                                oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['wasteRatio']?.hasError('pattern')">
                                <label [innerHTML]="_sharedComponentService.invalid_pattern_1">
                                </label>
                            </mat-error>
                        </mat-form-field>
                    </div>
                    
                    <!-- fabric width -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>عرض القماش</mat-label>
                            <input type="text" matInput formControlName="fabricWidth" placeholder="مثال: 4"
                                [errorStateMatcher]="matcher"
                                oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['fabricWidth'].hasError('required') && (manufacturingOrderWdForm.controls['fabricWidth'].dirty 
                                    || manufacturingOrderWdForm.controls['fabricWidth'].touched)">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['fabricWidth'].hasError('pattern')">
                                <label [innerHTML]="_sharedComponentService.invalid_pattern_number_only">
                                </label>
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <!-- fabricQuantityM2 -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>وزن القماش م2</mat-label>
                            <input type="text" matInput formControlName="fabricQuantityM2" placeholder="مثال: 4"
                                [errorStateMatcher]="matcher"
                                oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['fabricQuantityM2'].hasError('required') && (manufacturingOrderWdForm.controls['fabricQuantityM2'].dirty 
                                    || manufacturingOrderWdForm.controls['fabricQuantityM2'].touched)">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['fabricQuantityM2'].hasError('pattern')">
                                <label [innerHTML]="_sharedComponentService.invalid_pattern_number_only">
                                </label>
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <!-- Price -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>السعر*</mat-label>
                            <input type="text" matInput formControlName="price" placeholder="مثال: 15"
                                [errorStateMatcher]="matcher" (change)="changePrice('priceEG')"
                                oninput="this.value = this.value.replace(/[^1-90-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['price'].hasError('required') && (manufacturingOrderWdForm.controls['price'].dirty 
                                    || manufacturingOrderWdForm.controls['price'].touched)">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['price'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['price'].hasError('pattern')">
                                <label [innerHTML]="_sharedComponentService.invalid_pattern_number_only">
                                </label>
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <!-- priceDollar -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label>السعر دولار</mat-label>
                            <input type="text" matInput formControlName="priceDollar" placeholder="مثال: 15"
                                [errorStateMatcher]="matcher" (change)="changePrice('priceDollar')"
                                oninput="this.value = this.value.replace(/[^1-90-9.]/g, '').replace(/(\..*?)\..*/g, '$1');" />
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['priceDollar'].hasError('required') && (manufacturingOrderWdForm.controls['priceDollar'].dirty 
                                    || manufacturingOrderWdForm.controls['priceDollar'].touched)">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['priceDollar'].hasError('required')">
                                <label [innerHTML]="_sharedComponentService.required_field">
                                </label>
                            </mat-error>
                            <mat-error *ngIf="manufacturingOrderWdForm.controls['priceDollar'].hasError('pattern')">
                                <label [innerHTML]="_sharedComponentService.invalid_pattern_number_only">
                                </label>
                            </mat-error>
                        </mat-form-field>
                    </div>
                    
                    <!-- note2 -->
                    <div class="col">
                        <mat-form-field appearance="outline" class="example-full-width w-100">
                            <mat-label> الملاحظات </mat-label>
                            <textarea matInput rows="1" matTextareaAutosize 
                                 placeholder="الملاحظات" formControlName="note2"></textarea>
                                <mat-error *ngIf="manufacturingOrderWdForm.controls['note2'].hasError('pattern')">
                                    <label [innerHTML]="_sharedComponentService.invalid_message">
                                    </label>
                                </mat-error>
                        </mat-form-field>
                    </div>

                </div>

            </div>

            <!-- Buttons Section -->
            <div [class]="_sharedComponentService.btnSectionClass">
                <div class="row row-cols-auto">
                    <div class="col">
                        <button type="submit" class="btn-style submit-btn">تعديل</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>
