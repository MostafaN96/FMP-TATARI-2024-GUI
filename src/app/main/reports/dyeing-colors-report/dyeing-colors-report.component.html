<!-- Main Page Form -->
<div [class]="_sharedComponentService.mainPageFormClass">
    <div [class]="_sharedComponentService.subMainPageFormClass">
        <!-- Form Body -->
        <div [class]="_sharedComponentService.gridForm2Class">
            <div class="col">
                <div [class]="_sharedComponentService.tableSectionClass">

                    <div class="example-table-container">
                        <table id="table-data-2" mat-table matSort #sortColumns="matSort"
                            [dataSource]="dataSourceSearchTabel" [class]="_sharedComponentService.tableStyleClass">

                            <!-- color category name Column -->
                            <ng-container matColumnDef="color_category_name">
                                <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                    <b>فئة اللون</b>
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.color_category_name }}
                                </td>
                            </ng-container>

                            <!-- color name Column -->
                            <ng-container matColumnDef="color_name">
                                <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                    <b>اللون</b>
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.color_name }}
                                </td>
                            </ng-container>

                            <!-- code Column -->
                            <ng-container matColumnDef="code">
                                <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                    <b>الكود</b>
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.code }}
                                </td>
                            </ng-container>

                            <!-- price Column -->
                            <ng-container matColumnDef="price">
                                <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                    <b>السعر</b>
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.price }}
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
