<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass" id="main-page-title">
            <h2 [class]="_sharedComponentService.TitleTextClass">خدمات المصبغة</h2>
        </div>
    </div>

    <!-- Form Section -->
    <!-- Main Page Form -->
    <div [class]="_sharedComponentService.mainPageFormClass">
        <div [class]="_sharedComponentService.subMainPageFormClass">

            <!-- Form Body -->
            <div [class]="_sharedComponentService.gridForm2Class">
                <!-- Dyer -->
                <div class="col">
                    <ejs-autocomplete [dataSource]='dyers' [fields]='fieldsDyer' class="ejs-autocomplete"
                        (filtering)="onFilteringDyeing($event)" [placeholder]='textDyer' [autofill]='autofill'
                        (change)="selectDyeing($event)" style="width: 260px;">
                    </ejs-autocomplete>
                </div>

                <div class="col">

                    <div class="row row-cols-3">
                        <div id="table-header-data" class="col py-4">
                            <table class="table table-style">
                                <tbody>
                                    <tr>
                                        <th>المصبغة:</th>
                                        <td>{{selectedData?.name}}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="col">
                            <div class="btn-export-section">
                                <a
                                    (click)="_exportDataService.exportToPDF('table-header-data', 'table-data', 'تقرير خدمات المصبغة', 'table-data-2' )">
                                    <i title="PDF" class="far fa-file-pdf"></i>
                                </a>

                                <a
                                    (click)="_exportDataService.exportToExcel('table-header-data', 'table-data', 'تقرير خدمات المصبغة', 'table-data-2')">
                                    <i title="Excel" class="far fa-file-excel px-2"></i>
                                </a>

                                <a
                                    (click)="_exportDataService.print('table-header-data', 'table-data', 'تقرير خدمات المصبغة', 'table-data-2')">
                                    <i title="Print" class="fas fa-print pe-2"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <mat-form-field class="w-100" appearance="outline">
                        <input matInput [(ngModel)]="filter" (keyup)="applyFilter($any($event.target).value)"
                            placeholder="بحث" />
                    </mat-form-field>

                    <div class="example-table-container">
                        <table id="table-data" mat-table matSort #sortColumns="matSort"
                            [dataSource]="dataSourceSearchTabel" [class]="_sharedComponentService.tableStyleClass">

                            <!-- anointed services name Column -->
                            <ng-container matColumnDef="anointed_services_name">
                                <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                    <b>الخدمة</b>
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.name }}
                                </td>
                            </ng-container>

                            <!-- price Column -->
                            <ng-container matColumnDef="price">
                                <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                    <b>السعر</b>
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    {{ element.price }}
                                </td>
                            </ng-container>

                            <!-- is_fabric_piece Type Column -->
                            <ng-container matColumnDef="is_fabric_piece">
                                <th data-html2canvas-ignore="true" mat-header-cell *matHeaderCellDef
                                    style="width: 10px;">
                                    <b>يضرب بعدد الاكياس</b>
                                </th>
                                <td data-html2canvas-ignore="true" mat-cell *matCellDef="let element">
                                    <mat-checkbox class="px-1" [(ngModel)]="element.is_fabric_piece" [disabled]="true">
                                    </mat-checkbox>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<app-dyeing-colors-report *ngIf="selectedData" [selectedData]="selectedData"></app-dyeing-colors-report>
