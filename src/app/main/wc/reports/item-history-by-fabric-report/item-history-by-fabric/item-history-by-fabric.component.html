<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Loading Overlay -->
    <div *ngIf="isLoading" class="loading-overlay">
        <div class="loading-spinner">
            <mat-spinner diameter="50"></mat-spinner>
            <p>جاري تحميل البيانات...</p>
        </div>
    </div>

    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass" id="main-page-title">
            <h2 [class]="_sharedComponentService.TitleTextClass">تقرير جرد الخام</h2>
        </div>
    </div>

    <mat-tab-group animationDuration="0ms">
        <mat-tab label="إجمالي">
            <ng-template matTabContent>
                <app-item-history-by-fabric-total-wc>
                </app-item-history-by-fabric-total-wc>
            </ng-template>
        </mat-tab>
        <mat-tab label="تفصيلي">
            <ng-template matTabContent>
                <!-- Form Section -->

                <div class="container-fluid mt-2">
                    <div class="row row-cols-3">
                        <div class="col">
                            <div class="btn-export-section">
                                <a (click)="_exportDataService.onExportPDFGridAngular(gridApi, 'تقرير جرد القماش الخام', gridColumnApi, ['details'])">
                        <i title="PDF" class="far fa-file-pdf"></i>
                    </a>

                    <a (click)="_exportDataService.onExportExcelGridAngular(gridApi, 'تقرير جرد القماش الخام', ['details'])">
                        <i title="Excel" class="far fa-file-excel px-2"></i>
                    </a>
                    
                    <a
                    (click)="_exportDataService.printGrid(gridApi, 'تقرير جرد القماش الخام', gridColumnApi, ['details'], ['input_quantity', 'output_quantity', 'current_quantity'])">
                    <i title="Print" class="fas fa-print pe-2"></i>
                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main Page Form -->
                <div [class]="_sharedComponentService.mainPageFormClass">
                    <div [class]="_sharedComponentService.subMainPageFormClass">
                        <!-- Form Body -->
                        <div [class]="_sharedComponentService.gridForm2Class">
                            <div class="col">
                                <div [class]="_sharedComponentService.tableSectionClass">

                                    <div class="mb-4 report-toolbar">
                                        <mat-checkbox class="example-margin me-3" [(ngModel)]="isShowClosedBalances"
                                (change)="onToggleBalanceType($event)">اظهار الارصدة المغلقة</mat-checkbox>
                                        <button mat-raised-button color="warn" (click)="resetFilters()" class="ms-3">
                                            <i class="fas fa-undo me-2"></i>إعادة تعيين الفلاتر
                                        </button>

                                        <div class="date-filter">
                                            <label>من تاريخ
                                                <input type="date" class="form-control form-control-sm" [(ngModel)]="fromDate">
                                            </label>
                                            <label>إلى تاريخ
                                                <input type="date" class="form-control form-control-sm" [(ngModel)]="toDate">
                                            </label>
                                            <button mat-raised-button color="primary" (click)="applyDateFilter()" [disabled]="isLoading">
                                                <i class="fas fa-filter me-2"></i>تطبيق
                                            </button>
                                            <button mat-stroked-button *ngIf="appliedDateRange || fromDate || toDate" (click)="clearDateFilter()" [disabled]="isLoading">
                                                مسح التاريخ
                                            </button>
                                        </div>

                                        <button mat-raised-button [color]="isMarkingMode ? 'accent' : undefined" (click)="toggleMarkingMode()"
                                                [title]="isMarkingMode ? 'اضغط لإيقاف التعليم' : 'بعد التفعيل: اضغط على أي سطر لتعليمه'">
                                            <i class="fas fa-highlighter me-2"></i>{{ isMarkingMode ? 'إيقاف التعليم' : 'تعليم الأسطر' }}
                                        </button>
                                        <button mat-raised-button [color]="isShowInputMovements ? 'accent' : undefined" (click)="toggleInputMovements()">
                                            <i class="fas fa-sign-in-alt me-2"></i>{{ isShowInputMovements ? 'إخفاء حركات الإدخال' : 'إظهار حركات الإدخال' }}
                                        </button>
                                        <button mat-stroked-button *ngIf="markedRows.size" (click)="clearMarkedRows()">
                                            <i class="fas fa-eraser me-2"></i>إلغاء تعليم الأسطر ({{ markedRows.size }})
                                        </button>
                                    </div>

                                    <div class="date-hint" *ngIf="appliedDateRange">
                                        الإدخال والإخراج لحركات الفترة
                                        <b>{{ appliedDateRange.fromDate || 'البداية' }}</b> ←
                                        <b>{{ appliedDateRange.toDate || 'اليوم' }}</b>
                                        — «الرصيد» هو الرصيد الحالي، وأرصدة الفترة في «رصيد أول المدة» و«رصيد آخر المدة».
                                    </div>

                                    <div id="table-header-data-report" [class.marking-mode]="isMarkingMode"
                        dir="rtl"
                        class="ag-theme-alpine ag-rtl">

                            <ag-grid-angular 
                            #agGrid
                            class="ag-theme-alpine ag-rtl ag-compact" 
                            [ngStyle]="_sharedComponentService.gridStyle"
                                [loadingCellRenderer]="loadingCellRenderer" 
                                [loadingCellRendererParams]="loadingCellRendererParams"
                                (gridReady)="onGridReady($event)"
                                [columnDefs]="columnDefs" 
                                [defaultColDef]="defaultColDef"
                                [enableRangeSelection]="true" 
                                [enableFillHandle]="true" 
                                [undoRedoCellEditing]="true"
                                [enableCellChangeFlash]="true"
                                [rowData]="fabrics" 
                                [sideBar]="sideBar"
                                [localeText]="_sharedComponentService.localeText" 
                                [pinnedBottomRowData]="pinnedBottomRowData"
                                [rowClassRules]="rowClassRules"
                                (rowClicked)="onRowClicked($event)"
                                (modelUpdated)="onModelUpdated()">
                            </ag-grid-angular>

                        </div>

                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </ng-template>
        </mat-tab>
    </mat-tab-group>
</section>
