<!-- Loading Overlay -->
<div *ngIf="isLoading" class="loading-overlay">
  <div class="loading-spinner">
    <mat-spinner diameter="50"></mat-spinner>
    <p>جاري تحميل البيانات...</p>
  </div>
</div>

<div class="container-fluid mt-2">
  <div class="row row-cols-3">
    <div class="col">
      <div class="btn-export-section">
        <a (click)="_exportDataService.onExportPDFGridAngular(gridApi, 'تقرير جرد المصبغة', gridColumnApi, ['details'])">
          <i title="PDF" class="far fa-file-pdf"></i>
        </a>

        <a (click)="_exportDataService.onExportExcelGridAngular(gridApi, 'تقرير جرد المصبغة', ['details'])">
          <i title="Excel" class="far fa-file-excel px-2"></i>
        </a>

        <a (click)="_exportDataService.printGrid(gridApi, 'تقرير جرد المصبغة', gridColumnApi, ['details'], ['input_quantity', 'output_quantity', 'current_quantity'])">
          <i title="Print" class="fas fa-print pe-2"></i>
        </a>
      </div>
    </div>
  </div>
</div>

<div [class]="_sharedComponentService.mainPageFormClass">
  <div [class]="_sharedComponentService.subMainPageFormClass">
    <div [class]="_sharedComponentService.gridForm2Class">
      <div class="col">
        <div [class]="_sharedComponentService.tableSectionClass">

          <div class="mb-4">
            <mat-checkbox class="example-margin me-3" [(ngModel)]="isShowClosedBalances" (change)="getClosedBalances()">اظهار الارصدة المغلقة</mat-checkbox>
          </div>

          <div class="ag-grid-toolbar row row-cols-5 g-2 mb-3">
            <div class="col">
              <mat-form-field appearance="outline" class="example-form-field w-100">
                <mat-label>البحث بالتاريخ</mat-label>
                <mat-date-range-input [rangePicker]="rangePicker">
                  <input [disabled]="true" matStartDate [(ngModel)]="startDate" placeholder="Start date">
                  <input [disabled]="true" matEndDate [(ngModel)]="endDate" placeholder="End date">
                </mat-date-range-input>
                <mat-datepicker-toggle [disabled]="false" matSuffix [for]="rangePicker"></mat-datepicker-toggle>
                <mat-date-range-picker [disabled]="false" #rangePicker>
                  <mat-date-range-picker-actions>
                    <button mat-button matDateRangePickerCancel>اغلاق</button>
                    <button mat-raised-button color="primary" matDateRangePickerApply (click)="filterByDate()">بحث</button>
                  </mat-date-range-picker-actions>
                </mat-date-range-picker>
              </mat-form-field>
            </div>
            <div class="col d-flex align-items-center">
              <button mat-raised-button color="warn" (click)="resetFilters()" class="ms-3">
                <i class="fas fa-undo me-2"></i>إعادة تعيين الفلاتر
              </button>
            </div>
          </div>

          <div id="table-header-data-report" dir="rtl" class="ag-theme-alpine ag-rtl">
            <ag-grid-angular
              #agGrid
              class="ag-theme-alpine ag-rtl ag-compact"
              [ngStyle]="_sharedComponentService.gridStyle"

              [rowData]="fabrics"
              [columnDefs]="columnDefs"
              [defaultColDef]="defaultColDef"
              [sideBar]="sideBar"
              [localeText]="_sharedComponentService.localeText"
              [enableRtl]="true"
              [suppressContextMenu]="true"
              [animateRows]="false"
              [rowBuffer]="10"

              [pinnedBottomRowData]="pinnedBottomRowData"
              [overlayLoadingTemplate]="loadingOverlayTemplate"
              [overlayNoRowsTemplate]="noRowsOverlayTemplate"

              [loadingCellRenderer]="loadingCellRenderer"
              [loadingCellRendererParams]="loadingCellRendererParams"

              (gridReady)="onGridReady($event)"
              (modelUpdated)="onModelUpdated()">
            </ag-grid-angular>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
