<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass">
            <h2 [class]="_sharedComponentService.TitleTextClass">إظهار جميع الخيوط</h2>
        </div>
    </div>
    <!-- Form Section -->
    <!-- Main Page Form -->
    <div [class]="_sharedComponentService.mainPageFormClass">
        <div [class]="_sharedComponentService.subMainPageFormClass">
            <!-- Form Body -->
            <div [class]="_sharedComponentService.gridForm2Class">
                <div class="col">
                    <div [class]="_sharedComponentService.tableSectionClass">




                            <p-table #dt1 [value]="yarns" [(selection)]="selectedData" dataKey="id"
                                    columnResizeMode="expand"
                                    styleClass="p-datatable-sm p-datatable-gridlines p-datatable-striped" [rowHover]="true"
                                    [rows]="10" [showCurrentPageReport]="true" [loading]="loading" responsiveLayout="scroll"
                                    scrollHeight="600px" [filterDelay]="0" sortField="code" [responsive]="true" [sortOrder]="1"
                                    appendTo="body" [autoLayout]="true">
                                    <ng-template data-html2canvas-ignore="true" pTemplate="caption">
    
                                        <!-- Start Filter Section -->
                                        <div class="row row-cols-md-5 align-items-center">
    
                                            <div class="col">
                                                <p-columnFilter field="name" matchMode="yarn-name-filter" [showMenu]="false"
                                                    [showClearButton]="false">
                                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                                        <p-multiSelect [ngModel]="selectedYarns"
                                                            [options]="_sharedComponentService.uniqueArray(yarns, 'name')"
                                                            (onChange)="onMultiselectedYarns($event.value)"
                                                            placeholder="البحث بـ اسم الخيط" optionLabel="name">
                                                            <ng-template let-option pTemplate="item">
                                                                <div class="p-multiselect-representative-option">
                                                                    <span class="ml-1">{{option.name}}</span>
                                                                </div>
                                                            </ng-template>
                                                        </p-multiSelect>
                                                    </ng-template>
                                                </p-columnFilter>
                                            </div>
    
    
                                            <div class="col">
                                                <p-columnFilter field="code" matchMode="code-filter" [showMenu]="false"
                                                    [showClearButton]="false">
                                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                                        <p-multiSelect [ngModel]="selectedCodes"
                                                            [options]="_sharedComponentService.uniqueArray(yarns, 'code')"
                                                            (onChange)="onMultiselectedCodes($event.value)"
                                                            placeholder="البحث بـ الكود" optionLabel="code">
                                                            <ng-template let-option pTemplate="item">
                                                                <div class="p-multiselect-representative-option">
                                                                    <span class="ml-1">{{option.code}}</span>
                                                                </div>
                                                            </ng-template>
                                                        </p-multiSelect>
                                                    </ng-template>
                                                </p-columnFilter>
                                            </div>

                                            <div class="col">
                                                <div data-html2canvas-ignore="true" class="flex">
                                                    <button data-html2canvas-ignore="true" pButton label="اعادة"
                                                        class="p-button-outlined" icon="pi pi-filter-slash"
                                                        (click)="clear(dt1)"></button>
                                                </div>
                                            </div>
    
                                        </div>
                                        <!-- End Filter Section -->
    
                                    </ng-template>
                                    <ng-template pTemplate="header">
                                        <tr>
                                            <!-- Select Column -->
                                            <th data-html2canvas-ignore="true">
                                                <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                                            </th>
    
                                            <!-- Index Column -->
                                            <th data-html2canvas-ignore="true">
                                                التسلسل
                                            </th>
    
                                            <!-- name Column -->
                                            <th pResizableColumn pSortableColumn="name">
                                                <div class="flex justify-content-between align-items-center">
                                                    اسم الخيط
                                                    <p-sortIcon data-html2canvas-ignore="true" field="name">
                                                    </p-sortIcon>
                                                </div>
                                            </th>

                                            <!-- code Column -->
                                            <th pResizableColumn pSortableColumn="code">
                                                <div class="flex justify-content-between align-items-center">
                                                    الكود
                                                    <p-sortIcon data-html2canvas-ignore="true" field="code">
                                                    </p-sortIcon>
                                                </div>
                                            </th>

                                            <!-- Update Column -->
                                            <th pResizableColumn data-html2canvas-ignore="true">
                                                <div class="flex justify-content-between align-items-center">
                                                    تعديل
                                                </div>
                                            </th>
    
                                        </tr>
                                    </ng-template>
                                    <ng-template pTemplate="body" let-element let-index="rowIndex">
                                        <tr class="p-selectable-row">
    
                                            <!-- Select Column -->
                                            <td data-html2canvas-ignore="true">
                                                <p-tableCheckbox [value]="element"></p-tableCheckbox>
                                            </td>
    
                                            <!-- Index Column -->
                                            <td data-html2canvas-ignore="true">
                                                {{index + 1}}
                                            </td>
    
                                            <!-- name Column -->
                                            <td>
                                                {{ element.name }}
                                            </td>
    
    
                                            <!-- code Column -->
                                            <td>
                                                {{ element.code }}
                                            </td>

                                            <!-- Update Column -->
                                            <td>
                                                <a onClick="document.getElementById('update-form').scrollIntoView();"
                                                    (click)="getSelectedData(element)">
                                                    <i class="fas fa-edit update-symbol"></i>
                                                </a>
                                            </td>
    
                                        </tr>
                                    </ng-template>
                                    <ng-template data-html2canvas-ignore="true" pTemplate="emptymessage">
                                        <tr>
                                            <td colspan="11">لا يوجد بيانات</td>
                                        </tr>
                                    </ng-template>
                                </p-table>

                    </div>
                </div>
            </div>


        </div>
        <!-- Buttons Section -->
        <div [class]="_sharedComponentService.btnSectionClass">
            <div class="row row-cols-auto">
                <div class="col">
                    <button [disabled]="selectedData.length < 1" (click)="delete()" type="submit"
                        class="btn-style delete-btn">حذف</button>
                </div>
            </div>
        </div>
    </div>
</section>

<app-update-yarn *ngIf="selectedDataToUpdate" [selectedData]="selectedDataToUpdate"></app-update-yarn>
