<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass">
            <h2 [class]="_sharedComponentService.TitleTextClass">احصائيات البيع بالعميل</h2>
        </div>
    </div>
    <div class="row-cols-3">
        <div class="col">
            <ejs-autocomplete [dataSource]='sellers' [fields]='fieldsSeller' class="ejs-autocomplete"
                (filtering)="onFilteringSeller($event)" [placeholder]='textSeller' [autofill]='autofill'
                (change)="getSelectedItem($event)" style="width: 260px;">
            </ejs-autocomplete>
        </div>
    </div>
</section>
<app-bar-chart-report-by-supplier #barChartBySupplierReport (parentFun)="getSelectedItem($event)">
</app-bar-chart-report-by-supplier>
