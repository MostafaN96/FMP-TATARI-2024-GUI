<div style="display: none" [class]="_sharedComponentService.subTitlePageClass" id="main-page-title">
    <h2 [class]="_sharedComponentService.TitleTextClass">جرد المخزن الجاهز</h2>
</div>
<div [class]="_sharedComponentService.gridForm2Class">
    <div class="col">
        <div class="btn-export-section">
            <a (click)="_exportDataService.onExportPDFGridAngular(gridApi, 'تقرير الجاهز', gridColumnApi, ['editData'])">
                        <i title="PDF" class="far fa-file-pdf"></i>
                    </a>

                    <a (click)="_exportDataService.onExportExcelGridAngular(gridApi, 'تقرير الجاهز', ['editDataeditData'])">
                        <i title="Excel" class="far fa-file-excel px-2"></i>
                    </a>
                    
                    <a
                    (click)="_exportDataService.printGrid(gridApi, 'تقرير الجاهز', gridColumnApi, ['editData'], ['input_quantity', 'output_quantity', 'current_quantity'])">
                    <i title="Print" class="fas fa-print pe-2"></i>
                </a>
        </div>
    </div>

    <div class="col pb-4">
        <div [class]="_sharedComponentService.tableSectionClass">

            <div id="table-header-data-report">
                <!-- <div class="example-table-container"> -->

                <div data-html2canvas-ignore="true" class="flex mt-1 mb-2">
                    <button data-html2canvas-ignore="true" pButton label="اعادة" class="p-button-outlined"
                        icon="pi pi-filter-slash" (click)="clear()"></button>
                </div>

                <div 
                id="table-header-data-report" 
                dir="rtl"
                class="ag-theme-alpine ag-rtl current-stock-grid">
                    <ag-grid-angular
                    class="ag-theme-alpine ag-rtl" 
                        style="width: 100%; height: 600px;"
                        [enableRtl]="true"
                        [rowData]="dyersAndRequisitionsFabrics"
                        [columnDefs]="columnDefs"
                        [defaultColDef]="defaultColDef"
                        [rowSelection]="rowSelection"
                        [pagination]="false"
                        [animateRows]="false"
                        [rowBuffer]="5"
                        [valueCache]="true"
                        [headerHeight]="56"
                        [rowHeight]="54"
                        [suppressContextMenu]="true"
                        [suppressRowClickSelection]="true"
                        [enableCellTextSelection]="true"
                        [pinnedBottomRowData]="pinnedBottomRowData"
                        (gridReady)="onGridReady($event)"
                        (modelUpdated)="onModelUpdated()"
                        (rowSelected)="onRowSelected($event)"
                        (cellClicked)="onCellClicked($event)">
                    </ag-grid-angular>
                </div>

                <!-- </div> -->

            </div>
        </div>
    </div>
</div>
<app-update-current-stock-report-we *ngIf="showInputUpdate" [selectedData]="selectedDataToUpdate">
</app-update-current-stock-report-we>
