<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass">
            <h2 [class]="_sharedComponentService.TitleTextClass">إظهار جميع اسعار الوان المصبغه</h2>
        </div>
    </div>
    <!-- Form Section -->
    <!-- Main Page Form -->
    <div [class]="_sharedComponentService.mainPageFormClass">
            <div [class]="_sharedComponentService.subMainPageFormClass">
                <!-- Form Body -->
                <div [class]="_sharedComponentService.gridForm2Class">
                    <div class="col">
                        <div [class]="_sharedComponentService.tableSectionClass">
                            <!-- Start Filter Section -->
                        <mat-form-field appearance="outline" *ngFor="let filter of filterSelectObj"
                        style="margin-left: 15px;">
                        <mat-label>البحث بـ {{filter.name}}</mat-label>
                        <select matNativeControl name="{{filter.columnProp}}" [(ngModel)]="filter.modelValue"
                            (change)="_sharedComponentService.filterChange(filter, $event, 'regular', dataSourceSearchTabel,
                          filterValues, startDate, endDate, 'date')">
                            <option value="">-- اختيار {{filter.name}} --</option>
                            <option [value]="item" *ngFor="let item of filter.options">{{item}}</option>
                        </select>
                    </mat-form-field>

                    <button class="mx-2 btn-filter submit-btn" mat-flat-button
                        (click)="resetFilters(filterSelectObj)">إعادة</button>
                    <!-- End Filter Section -->
                    
                            <mat-form-field class="w-100" appearance="outline">
                                <input matInput [(ngModel)]="filter" (keyup)="applyFilter($any($event.target).value)"
                                    placeholder="بحث" />
                            </mat-form-field>
                            <div class="example-table-container">
                            <table mat-table matSort #sortColumns="matSort" [dataSource]="dataSourceSearchTabel"
                            [class]="_sharedComponentService.tableStyleClass">

                                <!-- Checkbox Column -->
                                <ng-container matColumnDef="select">
                                    <th mat-header-cell *matHeaderCellDef>
                                        <mat-checkbox (change)="$event ? masterToggle() : null"
                                            [checked]="selection.hasValue() && isAllSelected()"
                                            [indeterminate]="selection.hasValue() && !isAllSelected()"
                                            (change)="selectAll()">
                                        </mat-checkbox>
                                    </th>
                                    <td mat-cell *matCellDef="let row" style="width: 5%;">
                                        <mat-checkbox (click)="getSelectedIndex(row)" (click)="$event.stopPropagation()"
                                            (change)="$event ? selection.toggle(row) : null"
                                            [checked]="selection.isSelected(row)">
                                        </mat-checkbox>
                                    </td>
                                </ng-container>
                                
                                 <!-- supplier name Column -->
                                 <ng-container matColumnDef="dyeing_name">
                                    <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                        <b>المورد</b>
                                    </th>
                                    <td mat-cell *matCellDef="let element">
                                        {{ element.dyeing_name }}
                                    </td>
                                </ng-container>

                                 <!-- color category name Column -->
                                 <ng-container matColumnDef="color_category_name">
                                    <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                        <b>فئة اللون</b>
                                    </th>
                                    <td mat-cell *matCellDef="let element">
                                        {{ element.color_category_name }}
                                    </td>
                                </ng-container>

                                 <!-- color name Column -->
                                 <ng-container matColumnDef="color_name">
                                    <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                        <b>اللون</b>
                                    </th>
                                    <td mat-cell *matCellDef="let element">
                                        {{ element.color_name }}
                                    </td>
                                </ng-container>

                                <!-- code Column -->
                                <ng-container matColumnDef="code">
                                    <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                        <b>الكود</b>
                                    </th>
                                    <td mat-cell *matCellDef="let element">
                                        {{ element.code }}
                                    </td>
                                </ng-container>

                                <!-- price Column -->
                                <ng-container matColumnDef="price">
                                    <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                        <b>السعر</b>
                                    </th>
                                    <td mat-cell *matCellDef="let element">
                                        {{ element.price }}
                                    </td>
                                </ng-container>

                                <!-- Update Column -->
                                <ng-container matColumnDef="update">
                                    <th data-html2canvas-ignore="true" mat-header-cell *matHeaderCellDef>
                                        <b>تعديل</b>
                                    </th>
                                    <td data-html2canvas-ignore="true" mat-cell *matCellDef="let row">
                                        <a onClick="document.getElementById('update-form').scrollIntoView();"
                                       (click)="getSelectedData(row)">
                                            <i class="fas fa-edit update-symbol"></i>
                                        </a>
                                    </td>
                                </ng-container>

                                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                            </table>
                        </div>
                        </div>
                    </div>
                </div>

                <!-- Buttons Section -->
                <div [class]="_sharedComponentService.btnSectionClass">
                    <div class="row row-cols-auto">
                        <div class="col">
                            <button [disabled]="selectedData.length < 1" 
                            (click)="delete()"
                            type="submit" class="btn-style delete-btn">حذف</button>
                        </div>
                    </div>
                </div>
            </div>
    </div>
</section>

<app-update-anointed-colors-prices *ngIf="selectedDataToUpdate" [selectedData]="selectedDataToUpdate"></app-update-anointed-colors-prices>
