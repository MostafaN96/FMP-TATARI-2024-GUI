<div [class]="_sharedComponentService.gridForm2Class">
    <div class="col" id="main-page-title">
        <div class="btn-export-section">
            <a (click)="_exportDataService.exportToPDF('table-header-data', 'table-data-report-wd', 'جرد المخزن الجاهز')">
                <i title="PDF" class="far fa-file-pdf"></i>
            </a>

            <a (click)="exportAgGridToExcel()">
                <i title="Excel" class="far fa-file-excel px-2"></i>
            </a>

            <a
                (click)="_exportDataService.print('table-header-data', 'table-data-report-wd', 'جرد المخزن الجاهز', 'table-data-2')">
                <i title="Print" class="fas fa-print pe-2"></i>
            </a>
        </div>
    </div>

    <div class="col pb-4">
        <div [class]="_sharedComponentService.tableSectionClass">

            <div id="table-header-data-report">
                <div data-html2canvas-ignore="true" class="flex mt-1 mb-2">
                    <button data-html2canvas-ignore="true" pButton label="اعادة" class="p-button-outlined"
                        icon="pi pi-filter-slash" (click)="clear()"></button>
                </div>

                <div id="table-data-report-wd" dir="rtl" class="ag-theme-alpine ag-rtl current-stock-wd-grid">
                    <ag-grid-angular
                        #agGrid
                        class="ag-theme-alpine ag-rtl ag-compact"
                        [ngStyle]="_sharedComponentService.gridStyle"
                        [gridOptions]="gridOptions"
                        [enableRtl]="true"
                        [rowData]="formDyeingFabricsByDyer"
                        [columnDefs]="columnDefs"
                        [defaultColDef]="defaultColDef"
                        [sideBar]="sideBar"
                        [localeText]="_sharedComponentService.localeText"
                        [rowSelection]="rowSelection"
                        [pagination]="false"
                        [animateRows]="false"
                        [rowBuffer]="5"
                        [valueCache]="true"
                        [headerHeight]="56"
                        [rowHeight]="54"
                        [suppressContextMenu]="true"
                        [suppressRowClickSelection]="true"
                        [enableCellTextSelection]="true"
                        (gridReady)="onGridReady($event)"
                        (rowSelected)="onRowSelected($event)"
                        (cellClicked)="onCellClicked($event)">
                    </ag-grid-angular>
                </div>


            </div>

        </div>
    </div>
</div>

<app-update-dyeing-services-wd *ngIf="showDyeingServciesUpdate" [selectedData]="selectedDataToUpdate">
</app-update-dyeing-services-wd>
