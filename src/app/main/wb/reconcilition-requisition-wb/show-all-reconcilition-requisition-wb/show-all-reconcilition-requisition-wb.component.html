<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass">
            <h2 [class]="_sharedComponentService.TitleTextClass">إظهار جميع اذونات تسوية</h2>
        </div>
    </div>
    <!-- Form Section -->
    <!-- Main Page Form -->
    <div [class]="_sharedComponentService.mainPageFormClass">
            <div [class]="_sharedComponentService.subMainPageFormClass">
                <!-- Form Body -->
                <div [class]="_sharedComponentService.gridForm2Class">
                    <div class="col">
                        <div [class]="_sharedComponentService.tableSectionClass">
                            <div id="table-header-data-report">
                                <p-table #dt1 [value]="yarns" dataKey="id"
                                    columnResizeMode="expand"
                                    styleClass="p-datatable-sm p-datatable-gridlines p-datatable-striped" [rowHover]="true"
                                    [rows]="10" [showCurrentPageReport]="true" [loading]="loading" responsiveLayout="scroll"
                                    scrollHeight="600px" [filterDelay]="0" sortField="number" [responsive]="true"
                                    [sortOrder]="0" appendTo="body" [autoLayout]="true">
                                    <ng-template data-html2canvas-ignore="true" pTemplate="caption">
    
                                        <!-- Start Filter Section -->
                                        <div class="row row-cols-md-5 align-items-center">
    
                                            <div class="col">
                                                <p-calendar class="w-100"
                                                placeholder="البحث بـ التاريخ"
                                                [(ngModel)]="dateFilters"
                                                        appendTo="body"
                                                        selectionMode="range"
                                                        [readonlyInput]="true"
                                                        [showIcon]="true"
                                                        dateFormat="dd/mm/yy"
                                                        (onClickOutside)="selectedDate($event)">
                                                        </p-calendar>
                                            </div>
    
                                            <div class="col">
                                                <p-columnFilter field="industry_name" matchMode="industry-name-filter" [showMenu]="false"
                                                    [showClearButton]="false">
                                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                                        <p-multiSelect [ngModel]="selectedIndustryName"
                                                            [options]="_sharedComponentService.uniqueArray(yarns, 'industry_name')"
                                                            (onChange)="onMultiselectedIndustryName($event.value)"
                                                            placeholder="البحث بـ المصنع" optionLabel="industry_name">
                                                            <ng-template let-option pTemplate="item">
                                                                <div class="p-multiselect-representative-option">
                                                                    <span class="ml-1">{{option.industry_name}}</span>
                                                                </div>
                                                            </ng-template>
                                                        </p-multiSelect>
                                                    </ng-template>
                                                </p-columnFilter>
                                            </div>

                                            <div class="col">
                                                <p-columnFilter field="creator_id" matchMode="creator-id-filter" [showMenu]="false"
                                                    [showClearButton]="false">
                                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                                        <p-multiSelect [ngModel]="selectedCreatorId"
                                                            [options]="_sharedComponentService.uniqueArray(yarns, 'creator_id')"
                                                            (onChange)="onMultiselectedCreatorId($event.value)"
                                                            placeholder="البحث بـ المستخدم" optionLabel="creator_id">
                                                            <ng-template let-option pTemplate="item">
                                                                <div class="p-multiselect-representative-option">
                                                                    <span class="ml-1">{{option.creator_id}}</span>
                                                                </div>
                                                            </ng-template>
                                                        </p-multiSelect>
                                                    </ng-template>
                                                </p-columnFilter>
                                            </div>
                                            
                                            <div class="col">
                                                <div data-html2canvas-ignore="true" class="flex">
                                                    <button data-html2canvas-ignore="true" pButton label="اعادة"
                                                        class="p-button-outlined" icon="pi pi-filter-slash"
                                                        (click)="clear(dt1)"></button>
                                                </div>
                                            </div>
    
                                        </div>
                                        <!-- End Filter Section -->
    
                                    </ng-template>
                                    <ng-template pTemplate="header">
                                        <tr>
    
                                            <!-- Number Column -->
                                            <th>
                                                رقم الإذن
                                                <p-sortIcon data-html2canvas-ignore="true" field="number"></p-sortIcon>
                                            </th>
    
                                            <!-- Date Column -->
                                            <th pResizableColumn pSortableColumn="date">
                                                <div class="flex justify-content-between align-items-center">
                                                    تاريخ الإذن
                                                    <p-sortIcon data-html2canvas-ignore="true" field="date">
                                                    </p-sortIcon>
                                                </div>
                                            </th>
    
                                            <!-- industry_name Column -->
                                            <th pResizableColumn pSortableColumn="industry_name">
                                                <div class="flex justify-content-between align-items-center">
                                                    المصنع
                                                    <p-sortIcon data-html2canvas-ignore="true" field="industry_name">
                                                    </p-sortIcon>
                                                </div>
                                            </th>

                                             <!-- creator_id Column -->
                                             <th pResizableColumn pSortableColumn="creator_id">
                                                <div class="flex justify-content-between align-items-center">
                                                    المستخدم
                                                    <p-sortIcon data-html2canvas-ignore="true" field="creator_id">
                                                    </p-sortIcon>
                                                </div>
                                            </th>
                                            
                                          
                                            <!-- note Column -->
                                            <th>
                                                <div class="flex justify-content-between align-items-center">
                                                    الملاحظات
                                                   
                                                </div>
                                            </th>                           
    
                                            <!-- Details Column -->
                                            <th data-html2canvas-ignore="true">
                                                <div class="flex justify-content-between align-items-center">
                                                    تفاصيل الإذن
                                                </div>
                                            </th>
                                        </tr>

                                    </ng-template>
                                    <ng-template pTemplate="body" let-element let-index="rowIndex">
                                        <tr class="p-selectable-row"  [ngClass]="{'warning_background': element.is_active == '0'}">
    
                                            <!-- Index Column -->
                                            <td>
                                                {{element.number}}
                                            </td>
    
                                            <!-- Date Column -->
                                            <td>
                                                {{element.date | date:'EEEE, d/M/y' }}
                                            </td>
                                            
                                            <!-- industry_name Column -->
                                            <td>
                                                {{ element.industry_name }}
                                            </td>

                                             <!-- creator_id Column -->
                                             <td>
                                                {{ element.creator_id }}
                                            </td>
    
                                            <!-- note Column -->
                                            <td>
                                                {{ element.note }}
                                            </td>
    
                                            <!-- Details Column -->
                                            <td data-html2canvas-ignore="true">
                                                <a
                                                [routerLink]="['details']"
                                                [queryParams]="{ id: element.id}">
                                                    <i class="fas fa-angle-double-right update-symbol"></i>
                                                </a>
                                            </td>
    
                                        </tr>
                                    </ng-template>
                                    <ng-template data-html2canvas-ignore="true" pTemplate="emptymessage">
                                        <tr>
                                            <td colspan="6">لا يوجد بيانات</td>
                                        </tr>
                                    </ng-template>
                                </p-table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
    </div>
</section>
