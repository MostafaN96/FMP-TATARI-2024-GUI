<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
    <!-- Title Page Section -->
    <div [class]="_sharedComponentService.titlePageClass">
        <!-- Sub Title Page -->
        <div [class]="_sharedComponentService.subTitlePageClass">
            <h2 [class]="_sharedComponentService.TitleTextClass">إظهار جميع طلبيات العملاء</h2>
        </div>
    </div>
    <!-- Form Section -->
    <!-- Main Page Form -->
    <div [class]="_sharedComponentService.mainPageFormClass">
        <div [class]="_sharedComponentService.subMainPageFormClass">
            <!-- Form Body -->
            <div [class]="_sharedComponentService.gridForm2Class">
                <div class="col">
                    <div [class]="_sharedComponentService.tableSectionClass">

                        <div class="mb-3">
                            <button mat-raised-button color="warn" (click)="resetFilters()" class="ms-3">
                                <i class="fas fa-undo me-2"></i>إعادة تعيين الفلاتر
                            </button>
                        </div>

                        <div id="table-header-data-report" dir="rtl" class="ag-theme-alpine ag-rtl">
                            <ag-grid-angular 
                                #agGrid
                                class="ag-theme-alpine ag-rtl" 
                                [ngStyle]="_sharedComponentService.gridStyle"
                                (gridReady)="onGridReady($event)"            
                                [columnDefs]="columnDefs" 
                                [defaultColDef]="defaultColDef"
                                [enableRangeSelection]="true" 
                                [enableFillHandle]="true" 
                                [undoRedoCellEditing]="true"
                                [enableCellChangeFlash]="true"
                                [rowData]="rowData" 
                                [localeText]="_sharedComponentService.localeText" 
                                [sideBar]="sideBar"
                                [rowSelection]="'multiple'"
                                [suppressRowClickSelection]="true"
                                [overlayLoadingTemplate]="loadingOverlayTemplate"
                                [overlayNoRowsTemplate]="noRowsOverlayTemplate"
                                >
                            </ag-grid-angular>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Buttons Section -->
            <div [class]="_sharedComponentService.btnSectionClass">
                <div class="row row-cols-auto">
                    <div class="col">
                        <button (click)="inquireReport()" 
                        type="submit"
                            class="btn-style submit-btn">
                        استعلام عن توافر القماش
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Confirm Popup for Close Order -->
    <p-confirmPopup></p-confirmPopup>
</section>
