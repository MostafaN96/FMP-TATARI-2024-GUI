<section [id]="_sharedComponentService.pageId()" [class]="_sharedComponentService.sectionClass">
  <div *ngIf="isLoading" class="loading-overlay">
    <div class="loading-spinner">
      <mat-spinner diameter="50"></mat-spinner>
      <p>جاري تحميل البيانات...</p>
    </div>
  </div>

  <div [class]="_sharedComponentService.titlePageClass">
    <div [class]="_sharedComponentService.subTitlePageClass" id="main-page-title">
      <h2 [class]="_sharedComponentService.TitleTextClass">تقرير جرد التصنيع</h2>
    </div>
  </div>

  <mat-tab-group animationDuration="0ms">
    <mat-tab label="إجمالي">
        <ng-template matTabContent>
      <app-item-history-total-report-wb></app-item-history-total-report-wb>
      </ng-template>
    </mat-tab>

    <mat-tab label="تفصيلي">
        <ng-template matTabContent>
      <div class="container-fluid mt-2">
        <div class="row row-cols-3">
          <div class="col">
            <div class="btn-export-section">
              <a (click)="_exportDataService.onExportPDFGridAngular(gridApi, 'تقرير جرد التصنيع', gridColumnApi, ['details_link'])">
                <i title="PDF" class="far fa-file-pdf"></i>
              </a>

              <a (click)="_exportDataService.onExportExcelGridAngular(gridApi, 'تقرير جرد التصنيع', ['details_link'])">
                <i title="Excel" class="far fa-file-excel px-2"></i>
              </a>

              <a (click)="_exportDataService.printGrid(gridApi, 'تقرير جرد التصنيع', gridColumnApi, ['details_link'], ['input_quantity', 'output_quantity', 'current_quantity'])">
                <i title="Print" class="fas fa-print pe-2"></i>
              </a>
            </div>
          </div>
        </div>
      </div>

      <div [class]="_sharedComponentService.mainPageFormClass">
        <div [class]="_sharedComponentService.subMainPageFormClass">
          <div [class]="_sharedComponentService.gridForm2Class">
            <div class="col">
              <div [class]="_sharedComponentService.tableSectionClass">

                <div class="mb-4">
                  <mat-checkbox class="example-margin me-3" [(ngModel)]="isShowClosedBalances" (change)="onToggleBalanceType($event)">اظهار الارصدة المغلقة</mat-checkbox>
                  <button mat-raised-button color="warn" (click)="resetFilters()" class="ms-3">
                    <i class="fas fa-undo me-2"></i>إعادة تعيين الفلاتر
                  </button>
                </div>

                <div id="table-header-data-report" dir="rtl" class="ag-theme-alpine ag-rtl">
                  <ag-grid-angular
                    #agGrid
                    class="ag-theme-alpine ag-rtl ag-compact"
                    [ngStyle]="_sharedComponentService.gridStyle"

                    [rowData]="yarns"
                    [columnDefs]="columnDefs"
                    [defaultColDef]="defaultColDef"

                    [sideBar]="sideBar"
                    [localeText]="_sharedComponentService.localeText"
                    [enableRtl]="true"
                    [suppressContextMenu]="true"
                    [animateRows]="false"
                    [rowBuffer]="10"

                    [pinnedBottomRowData]="pinnedBottomRowData"
                    [overlayLoadingTemplate]="loadingOverlayTemplate"
                    [overlayNoRowsTemplate]="noRowsOverlayTemplate"

                    [loadingCellRenderer]="loadingCellRenderer"
                    [loadingCellRendererParams]="loadingCellRendererParams"

                    (gridReady)="onGridReady($event)"
                    (modelUpdated)="onModelUpdated()">
                  </ag-grid-angular>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
    </mat-tab>
  </mat-tab-group>
</section>
